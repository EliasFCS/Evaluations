<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="linearGradient" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ff392b" />
      <stop offset="40%" stop-color="#209e52" />
      <stop offset="65%" stop-color="#1b71f4" />
      <stop offset="100%" stop-color="#fa8424" />
    </linearGradient>

    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#484F58" />
    </linearGradient>
  </defs>

  <rect x="6" y="6"
        width="788" height="188"
        rx="35" ry="35"
        fill="url(#linearGradient)"
        stroke="url(#strokeGradient)"
        stroke-width="7"/>

  <text x="400" y="100"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="50"
